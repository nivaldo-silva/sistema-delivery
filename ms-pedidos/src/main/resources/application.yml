server:
    port: 0

spring:
  application:
    name: ms-pedidos
  output:
    ansi:
      enabled: ALWAYS
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/pedidos
    username: root
    password: root
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  rabbitmq:
    host: localhost
    port: 5672
    username: rabbitmq
    password: root123

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${spring.application.instance_id:${random.value}}
    prefer-ip-address: true 
    hostname: localhost

logging:
  pattern:
    console: '%clr(%d{dd-MM-yyyy HH:mm:ss}){faint} %clr(%5p) %clr([%t]){faint} %clr(%-40.40logger){cyan} %clr(:){yellow} %m%n'
  level:
    root: INFO
    io.github.nivaldosilva: DEBUG
    org.springframework.web: DEBUG



